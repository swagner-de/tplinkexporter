# -- Number of exporter replicas. One is sufficient; the exporter is stateless.
replicaCount: 1

image:
  # -- Container image repository.
  repository: ghcr.io/swagner-de/tplinkexporter
  # -- Image tag. Defaults to the chart's appVersion when empty.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries.
imagePullSecrets: []
# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully qualified release name.
fullnameOverride: ""

config:
  # -- Metrics port the exporter listens on.
  listenPort: 9717
  # -- HTTP timeout in seconds for each switch request.
  timeoutSeconds: 10
  # -- Switches to scrape. Each entry needs a host and exactly one password
  # source: an inline `password` (the chart creates a Secret) or an
  # `existingSecret` reference (with `existingSecretKey`, default `password`).
  # Supply inline passwords via --set or CI, never commit real values.
  switches:
    - host: switch1.example.lan
      username: admin
      # Placeholder so the chart renders with default values. Override per switch
      # with a real --set password=... or switch to existingSecret.
      password: changeme
      existingSecret: ""
      existingSecretKey: password

service:
  # -- Kubernetes Service type.
  type: ClusterIP
  # -- Service port exposing /metrics.
  port: 9717

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor.
  enabled: false
  # -- Scrape interval.
  interval: 30s
  # -- Per-scrape timeout.
  scrapeTimeout: 10s
  # -- Extra labels for the ServiceMonitor (e.g. to match a Prometheus selector).
  labels: {}

# -- Container resource requests and limits.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# -- Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
# -- Extra annotations for the pod.
podAnnotations: {}
