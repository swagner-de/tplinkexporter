replicaCount: 1

image:
  repository: ghcr.io/swagner-de/tplinkexporter
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Exporter configuration. The non-secret fields (host, username, ports) are
# rendered into a ConfigMap. Each switch's password is read from a file mounted
# at /secrets/<host-slug>/password, so it never appears in the ConfigMap.
#
# Per switch, supply exactly one password source:
#   password:       inline value; the chart creates a Secret for this switch.
#                   Supply via --set or CI, never commit a real password.
#   existingSecret: name of a pre-existing Secret (e.g. from an ExternalSecret);
#                   existingSecretKey selects the key within it (default
#                   "password").
config:
  listenPort: 9717
  timeoutSeconds: 10
  switches:
    - host: switch1.example.lan
      username: admin
      password: ""
      existingSecret: ""
      existingSecretKey: password

service:
  type: ClusterIP
  port: 9717

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels for the ServiceMonitor (e.g. to match your Prometheus selector).
  labels: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
