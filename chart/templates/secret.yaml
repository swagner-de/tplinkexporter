{{- range $i, $sw := .Values.config.switches }}
{{- if $sw.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" (include "tplinkexporter.fullname" $) (include "tplinkexporter.hostslug" $sw.host) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "tplinkexporter.labels" $ | nindent 4 }}
type: Opaque
stringData:
  password: {{ $sw.password | quote }}
{{- end }}
{{- end }}
