apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tplinkexporter.fullname" . }}
  labels:
    {{- include "tplinkexporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tplinkexporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tplinkexporter.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: exporter
          image: {{ include "tplinkexporter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /config/config.yaml
          ports:
            - name: metrics
              containerPort: {{ .Values.config.listenPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- range $i, $sw := .Values.config.switches }}
            - name: {{ printf "secret-%s" (include "tplinkexporter.hostslug" $sw.host) }}
              mountPath: /secrets/{{ include "tplinkexporter.hostslug" $sw.host }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tplinkexporter.fullname" . }}
        {{- range $i, $sw := .Values.config.switches }}
        - name: {{ printf "secret-%s" (include "tplinkexporter.hostslug" $sw.host) }}
          secret:
            {{- if $sw.password }}
            secretName: {{ printf "%s-%s" (include "tplinkexporter.fullname" $) (include "tplinkexporter.hostslug" $sw.host) | trunc 63 | trimSuffix "-" }}
            items:
              - key: password
                path: password
            {{- else }}
            secretName: {{ $sw.existingSecret }}
            items:
              - key: {{ default "password" $sw.existingSecretKey }}
                path: password
            {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
