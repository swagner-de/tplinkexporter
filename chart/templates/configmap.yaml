apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tplinkexporter.fullname" . }}
  labels:
    {{- include "tplinkexporter.labels" . | nindent 4 }}
data:
  config.yaml: |
    listen_port: {{ .Values.config.listenPort }}
    timeout_seconds: {{ .Values.config.timeoutSeconds }}
    switches:
    {{- range $i, $sw := .Values.config.switches }}
      {{- if not $sw.host }}
      {{- fail (printf "config.switches[%d].host is required" $i) }}
      {{- end }}
      {{- if and $sw.password $sw.existingSecret }}
      {{- fail (printf "config.switches[%d] (%s): set only one of 'password' or 'existingSecret'" $i $sw.host) }}
      {{- end }}
      {{- if not (or $sw.password $sw.existingSecret) }}
      {{- fail (printf "config.switches[%d] (%s): one of 'password' or 'existingSecret' is required" $i $sw.host) }}
      {{- end }}
      - host: {{ $sw.host | quote }}
        username: {{ default "admin" $sw.username | quote }}
        password_file: /secrets/{{ include "tplinkexporter.hostslug" $sw.host }}/password
    {{- end }}
