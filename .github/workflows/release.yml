name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  release:
    permissions:
      contents: read
    uses: swagner-de/github-workflows/.github/workflows/release-please.yaml@b6e1470b73cd95eaa6ad713b728861814ce353af
    with:
      chart-path: chart
    secrets:
      release-app-client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
      release-app-private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
  image:
    needs: release
    if: needs.release.outputs.app-released == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: swagner-de/github-workflows/.github/workflows/container-publish.yaml@b6e1470b73cd95eaa6ad713b728861814ce353af
    with:
      release-sha: ${{ needs.release.outputs.app-sha }}
      version: ${{ needs.release.outputs.app-version }}
  chart:
    needs: release
    if: needs.release.outputs.chart-released == 'true'
    permissions:
      contents: read
      packages: write
    uses: swagner-de/github-workflows/.github/workflows/chart-publish.yaml@b6e1470b73cd95eaa6ad713b728861814ce353af
    with:
      chart-path: chart
      release-sha: ${{ needs.release.outputs.chart-sha }}
      version: ${{ needs.release.outputs.chart-version }}
      image-repository: ghcr.io/swagner-de/tplinkexporter
