name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./... -coverprofile cover.out
      - run: go build ./...
  semantic:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: swagner-de/github-workflows/.github/workflows/semantic-pr.yaml@b6e1470b73cd95eaa6ad713b728861814ce353af
  container:
    uses: swagner-de/github-workflows/.github/workflows/container-check.yaml@b6e1470b73cd95eaa6ad713b728861814ce353af
  chart:
    uses: swagner-de/github-workflows/.github/workflows/chart-check.yaml@b6e1470b73cd95eaa6ad713b728861814ce353af
    with:
      chart-path: chart
      check-docs: true
      image-repository: ghcr.io/swagner-de/tplinkexporter
